name: Release Linux (.deb & .tar.gz)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Nombre de la etiqueta / versión (ej: v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias de compilación para Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determinar etiqueta de versión
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            TAG="${{ github.event.inputs.custom_tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            APP_VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            TAG="v${APP_VER}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Versión a publicar: $TAG"

      - name: Compilar y empaquetar (.deb y .tar.gz)
        run: |
          chmod +x linux/packaging/build-linux-bundle.sh
          ./linux/packaging/build-linux-bundle.sh

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: Media Downloader ${{ steps.version_step.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.deb
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
